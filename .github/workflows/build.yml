
name: AfterLifeOS 14 - onclite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check runner storage
        run: |
          df -h /
          free -h
          nproc

      - name: Verify repository branches
        shell: bash
        run: |
          set -euo pipefail

          check_repo() {
            local repo="$1"
            local branch="$2"

            echo "Checking $repo ($branch)"

            git ls-remote --exit-code \
              --heads "https://github.com/$repo.git" \
              "refs/heads/$branch"
          }

          check_repo "AfterLifePrjkt13-Dev/device_xiaomi_onclite" "14"
          check_repo "AfterLifePrjkt13-Dev/vendor_xiaomi_onclite" "14"
          check_repo "AfterLifePrjkt13-Dev/kernel_xiaomi_onclite" "14"

      - name: Verify AfterLifeOS manifest
        run: |
          git ls-remote --exit-code \
            --heads https://github.com/AfterLifeOS/android_manifest.git \
            refs/heads/14

