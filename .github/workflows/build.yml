
name: AfterLifeOS 14 - onclite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check runner storage
        run: |
          df -h /
          free -h
          nproc

      - name: Verify repository branches
        shell: bash
        run: |
          set -euo pipefail

          check_repo() {
            local repo="$1"
            local branch="$2"

            echo "Checking $repo ($branch)"

            git ls-remote --exit-code \
              --heads "https://github.com/$repo.git" \
              "refs/heads/$branch"
          }

          check_repo "AfterLifePrjkt13-Dev/device_xiaomi_onclite" "14"
          check_repo "AfterLifePrjkt13-Dev/vendor_xiaomi_onclite" "14"
          check_repo "AfterLifePrjkt13-Dev/kernel_xiaomi_onclite" "14"

      
      - name: Verify AfterLifeOS manifest
        run: |
          git ls-remote --exit-code \
            --heads https://github.com/AfterLifeOS/android_manifest.git \
            refs/heads/14

      - name: Maximize Build Storage
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 4096
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Storage Audit
        shell: bash
        run: |
          echo "===== FILESYSTEM ====="
          df -h /

          echo "===== MEMORY ====="
          free -h

          echo "===== LARGEST DIRECTORIES ====="
          sudo du -xhd1 /usr /opt /home /tmp 2>/dev/null | sort -h

          echo "===== AVAILABLE SPACE ====="
          df -BG /

      - name: Verify Build Volume
        shell: bash
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== WORKSPACE STORAGE ====="
          df -h "$GITHUB_WORKSPACE"

          echo "===== WORKSPACE WRITABLE ====="
          touch "$GITHUB_WORKSPACE/testfile"
          rm "$GITHUB_WORKSPACE/testfile"

          echo "===== WORKSPACE CAPACITY ====="
          df -BG "$GITHUB_WORKSPACE"
