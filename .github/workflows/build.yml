name: Build Infinity-X 16 for onclite (3-Batch Split)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-pack:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Reclaim Maximum Root Disk Space (113 GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/* /var/lib/docker
          df -h /

      - name: Install Sync & Compression Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs zstd curl python-is-python3
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /usr/local/bin
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "lunarshade141"
          git config --global user.email "lunarshade141@users.noreply.github.com"
          
      - name: Chunked Shallow Sync (40 Projects Per Batch)
        run: |
          mkdir -p ~/rom && cd ~/rom
          repo init --depth=1 --no-repo-verify --git-lfs -u https://github.com/ProjectInfinity-X/manifest -b 16 -g default,-mips,-darwin,-notdefault
          git clone https://github.com/lunarshade141/local_manifests.git .repo/local_manifests

          ALL_PATHS=$(repo list -p)
          TOTAL=$(echo "$ALL_PATHS" | wc -l)
          echo "Total projects in manifest: $TOTAL"

          CHUNK_SIZE=40
          START=1
          while [ "$START" -le "$TOTAL" ]; do
            END=$((START + CHUNK_SIZE - 1))
            echo "=== Syncing projects $START to $END of $TOTAL ==="
            BATCH=$(echo "$ALL_PATHS" | sed -n "${START},${END}p")
            repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j4 $BATCH || true
            rm -rf .repo/projects/* .repo/project-objects/*
            df -h /
            START=$((END + 1))
          done

          rm -rf .repo prebuilts/qemu-kernel prebuilts/ndk prebuilts/maven_repo platform/prebuilts/qemu-kernel platform/prebuilts/ndk
          echo "=== Final size of ~/rom ==="
          du -sh ~/rom
          df -h /
          
      - name: Compress Source into 1.9GB Chunks
        run: |
          mkdir -p ~/chunks
          tar -C ~/rom -cf - . | zstd -3 -T0 | split -b 1900M - ~/chunks/infinity16-src.tar.zst.
          rm -rf ~/rom
          ls -lh ~/chunks
          df -h /

      - name: Upload Source Chunks to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: src-cache-${{ github.run_number }}
          name: Source Cache #${{ github.run_number }}
          draft: false
          prerelease: true
          files: ~/chunks/infinity16-src.tar.zst.*

  compile-rom:
    needs: sync-and-pack
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Reclaim Maximum Root Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/* /var/lib/docker
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 zstd
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Download & Extract Pre-Synced Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/chunks ~/rom
          gh release download src-cache-${{ github.run_number }} -D ~/chunks
          cat ~/chunks/infinity16-src.tar.zst.* | zstd -d -T0 | tar -C ~/rom -xf -
          rm -rf ~/chunks
          df -h /

      - name: Compile Infinity-X (Vanilla)
        working-directory: /home/runner/rom
        run: |
          source build/envsetup.sh
          lunch infinity_onclite-userdebug || lunch infinity_onclite-bp2a-userdebug || lunch infinity_onclite-baklava-userdebug
          m bacon -j$(nproc --all)

      - name: Upload ROM to GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Infinity-X 16 for onclite (Build #${{ github.run_number }})
          files: |
            /home/runner/rom/out/target/product/onclite/*onclite*.zip
            /home/runner/rom/out/target/product/onclite/boot.img
