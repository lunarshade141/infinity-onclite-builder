name: Build Infinity-X 16 for onclite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install Build Dependencies & Repo Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /usr/local/bin
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "lunarshade141"
          git config --global user.email "lunarshade141@users.noreply.github.com"

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 1
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: '/mnt'

      - name: Check Available Disk Space Before Sync
        run: df -h / /mnt

      - name: Initialize & Shallow Sync Infinity-X Source
        working-directory: /mnt
        run: |
          mkdir -p rom && cd rom
          repo init --depth=1 --no-repo-verify --git-lfs -u https://github.com/ProjectInfinity-X/manifest -b 16 -g default,-mips,-darwin,-notdefault
          git clone https://github.com/lunarshade141/local_manifests.git .repo/local_manifests
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)
          echo "=== Wiping .repo to reclaim disk space ==="
          rm -rf .repo
          df -h / /mnt

      - name: Compile Infinity-X (Vanilla)
        working-directory: /mnt/rom
        run: |
          mkdir -p /mnt/tmp
          export TMPDIR=/mnt/tmp
          source build/envsetup.sh
          lunch infinity_onclite-userdebug || lunch infinity_onclite-bp2a-userdebug || lunch infinity_onclite-baklava-userdebug
          m bacon -j$(nproc --all)

      - name: Upload ROM to GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Infinity-X 16 for onclite (Build #${{ github.run_number }})
          files: |
            /mnt/rom/out/target/product/onclite/*onclite*.zip
            /mnt/rom/out/target/product/onclite/boot.img
